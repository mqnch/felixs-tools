[project]
name = "planner-rl"
version = "0.1.0"
description = "Post-training Logger's query planner with execution-verified rewards"
requires-python = ">=3.12"
dependencies = [
    "common",
    "logger",
    "anthropic>=2.3",
    "pydantic>=2",
    "typer>=0.12",
]

[project.optional-dependencies]
# Cluster-side only. Kept out of the base install so data generation and the
# SLURM scaffold run on a laptop with no CUDA stack.
train = [
    "huggingface_hub>=0.25",
]

[project.scripts]
planner-rl = "planner_rl.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner_rl"]

[tool.uv.sources]
common = { workspace = true }
logger = { workspace = true }
